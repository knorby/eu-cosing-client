name: Release

# Disabled until the repository variable NPM_RELEASE_ENABLED is set to
# "true" AFTER the manual 0.1.0 publish and trusted-publisher setup.
# See docs/releasing.md. Publishing uses OIDC, without a stored npm token.
#
# Once enabled, runs on pushes to main. The `select-mode` job inspects state and
# picks what happens next:
#   - changesets found          -> `version` job runs `version:packages`
#     (bumps package.json, updates CHANGELOG.md and package-lock.json, deletes
#     consumed changesets) and opens or updates a "Version Packages" pull request.
#     Merging that PR triggers this workflow again, landing in publish mode.
#   - new version not yet on
#     npm (no changesets left) -> `pack` job builds and packs the packages;
#     `publish` job publishes via OIDC, pushes git tags, and creates a
#     GitHub Release.
#   - nothing to do             -> all downstream jobs are skipped (no-op).
#
# Permissions follow the changesets trusted-publishing guidance: top-level
# permissions are reset to none and each job receives only what it needs —
# `id-token: write` exists solely on the publish job.

on:
  push:
    branches: [main]
  # Manual trigger: lets you re-run select-mode (e.g. to retry a publish
  # after a transient failure) without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    if: github.ref == 'refs/heads/main' && vars.NPM_RELEASE_ENABLED == 'true'
    name: Select Changesets mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out repo (actions/checkout)
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version Packages PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create/update the Version Packages PR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Create or update the Version Packages pull request
        id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run version:packages

  pack:
    name: Build and pack packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out repo (actions/checkout)
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm pack --dry-run
      - name: Pack packages for publishing
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # to check out repo and create GitHub Releases (changesets/action/publish)
      id-token: write # for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Node 24's bundled npm still may not satisfy npm >= 11.5.1 for OIDC.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - name: Publish packed packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
